<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 238" width="580" height="238" role="img" aria-label="SPIDER SMART project banner"><title>SPIDER SMART</title>
<defs><linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#000000"/><stop offset=".58" stop-color="#080C1B"/><stop offset="1" stop-color="#140F25"/></linearGradient><linearGradient id="bar"><stop stop-color="#9FFFE0"/><stop offset="1" stop-color="#7A5CFF" stop-opacity=".2"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="a"/><feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>.mono{font-family:Consolas,Menlo,monospace}.sans{font-family:"Arial Black","Segoe UI",sans-serif;font-weight:800}.pulse{animation:throb 3.2s ease-in-out infinite;filter:url(#glow)}.wave{stroke-dasharray:8 9;animation:move 2s linear infinite}.orbit{transform-origin:477px 119px;animation:spin 26s linear infinite}@keyframes throb{50%{opacity:.35}}@keyframes move{to{stroke-dashoffset:-100}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.pulse,.wave,.orbit{animation:none}}</style>
