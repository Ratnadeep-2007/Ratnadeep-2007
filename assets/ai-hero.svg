<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" role="img" aria-label="Animated Ratnadeep Patil AI engineering portfolio with cyan and violet neural network">
<title>Ratnadeep Patil — intelligent systems engineer</title>
<defs>
  <linearGradient id="titleLine"><stop stop-color="#00E5FF"/><stop offset=".54" stop-color="#A9E9FF"/><stop offset="1" stop-color="#7A5CFF"/></linearGradient>
  <linearGradient id="sweep" x1="0" x2="1"><stop stop-color="#00E5FF" stop-opacity="0"/><stop offset=".5" stop-color="#9FFFE0" stop-opacity=".45"/><stop offset="1" stop-color="#7A5CFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="frame" x1="0" x2="1"><stop stop-color="#00E5FF" stop-opacity=".65"/><stop offset=".5" stop-color="#242439" stop-opacity=".3"/><stop offset="1" stop-color="#7A5CFF" stop-opacity=".72"/></linearGradient>
  <radialGradient id="nebula"><stop stop-color="#24204A" stop-opacity=".7"/><stop offset=".5" stop-color="#091326" stop-opacity=".46"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#26334C" stroke-width=".8"/></pattern>
  <clipPath id="revealFirst"><rect x="65" y="100" height="90" width="0"><animate attributeName="width" values="0;0;700;700;700" keyTimes="0;.04;.24;.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="revealLast"><rect x="65" y="186" height="100" width="0"><animate attributeName="width" values="0;0;0;600;600" keyTimes="0;.18;.25;.46;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<style>
  .mono{font-family:"JetBrains Mono",Consolas,Menlo,monospace}
  .display{font-family:"Orbitron","Arial Black","Segoe UI",sans-serif;font-weight:800;letter-spacing:5px}
  .edge{fill:none;stroke:#5A8DB3;stroke-width:1.05;opacity:.37;animation:blink 4.8s ease-in-out infinite}
  .node{filter:url(#glow);animation:pulse 3.1s ease-in-out infinite}
  .orbitA{transform-origin:991px 214px;animation:spin 29s linear infinite}
  .orbitB{transform-origin:991px 214px;animation:spinBack 23s linear infinite}
  .scan{animation:scan 10s linear infinite}
  .cursor{animation:cursor 1.1s steps(1,end) infinite}
  .wave{stroke-dasharray:20 44;animation:flow 3s linear infinite}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:.62}}
  @keyframes pulse{0%,100%{opacity:.7;filter:url(#glow)}50%{opacity:1;filter:url(#glow)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinBack{to{transform:rotate(-360deg)}}
  @keyframes scan{0%{transform:translateX(-650px)}100%{transform:translateX(1360px)}}
  @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-64}}
  @media (prefers-reduced-motion:reduce){.node,.edge,.orbitA,.orbitB,.scan,.cursor,.wave{animation:none}}
</style>
